## Baked into the image at /opt/emqx/etc/emqx.conf.
##
## EMQX config precedence: etc/base.hocon < data/configs/cluster.hocon (dashboard/API/CLI changes)
## < THIS FILE < environment variables. Everything set here is therefore read-only at runtime: a
## dashboard change to one of these keys does not stick. That is on purpose, so the committed
## file stays the source of truth.

node {
  ## The image entrypoint overrides this with emqx@<container ip> through EMQX_NODE__NAME.
  name = "emqx@127.0.0.1"
  cookie = "chargelatch-dev-cookie"
  data_dir = "data"
}

cluster {
  name = chargelatch
  discovery_strategy = manual
}

## ANONYMOUS FOR NOW: with no authenticators every client is accepted, and authorization allows
## every topic. Devices do not carry MQTT credentials yet. Before anything is deployed this needs
## per-device authentication and an ACL limiting a device to devices/<identity>/#.
authentication = []
authorization {
  no_match = allow
  sources = []
}

listeners.tcp.default {
  bind = "0.0.0.0:1883"
}
listeners.ws.default {
  bind = "0.0.0.0:8083"
}
## No TLS in dev: the image ships a public demo certificate that must never be relied on.
listeners.ssl.default.enable = false
listeners.wss.default.enable = false

mqtt {
  ## Devices publish small JSON documents; anything bigger is a bug.
  max_packet_size = 64KB
  ## Keep state for a device that drops off Wi-Fi briefly, but not forever.
  session_expiry_interval = 2h
}

dashboard {
  listeners.http.bind = 18083
  default_username = "admin"
  default_password = "chargelatch-dev"
}
